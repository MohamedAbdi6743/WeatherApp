# Logger
logging.level:
  web: DEBUG
  '[com.bptn.weatherapp]': DEBUG
  '[org.hibernate.type]': INFO
  
# Actuator Enabled
management.endpoints:
  web.exposure.include: "*"
  
# Active Profile
spring:
  profiles:
    # The remote Postgres server (prod/default) no longer exists, so run on in-memory H2 by default.
    # Set SPRING_PROFILES_ACTIVE=prod to use a real Postgres database.
    active: test

# DevTools Enabled     
  devtools:
    add-properties: true
    
# Jackson Settings
  jackson:
    time-zone: America/Toronto
    date-format: "yyyy-MM-dd HH:mm:ss"

# Email Settings
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    
# Common Database Settings
  sql:
    init:
      continue-on-error: false
  jpa:
    show-sql: true
    open-in-view: false
    properties:  
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
      hibernate:
        '[format_sql]': true
    hibernate:
      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      
---

# Default Profile
spring:
  config:
    activate:
      on-profile: default
        
# Database Settings
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weatherDB}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate   
      
---

# Prod Profile
server:
  port: 8080
  
spring:
  config:
    activate:
      on-profile: prod  
  
# Database Settings
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weatherDB}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2  
  jpa:
    hibernate:
      ddl-auto: validate   
      
---

# Test Profile

# 8081 because port 8080 is commonly taken by Apache/XAMPP
server:
  port: 8081
  
spring:
  config:
    activate.on-profile: test  
  
# Database Settings
  sql.init:
    mode: always
    continue-on-error: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa123#
    driverClassName: org.h2.Driver
  jpa:
    hibernate.ddl-auto: create-drop
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true  